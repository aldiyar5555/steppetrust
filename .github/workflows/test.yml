name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Compile
        run: npx hardhat compile
      - name: Run unit tests
        run: npx hardhat test
      - name: Run demo scenario
        run: npx hardhat run scripts/demo.js
